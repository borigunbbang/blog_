# Jekyll 사이트 설정
title: 학습 기록
description: 날짜별로 남기는 학습 기록 블로그
url: "https://borigunbbang.github.io"
baseurl: "/blog_"

# 이 저장소는 프로젝트 페이지(<user>.github.io/blog_)로 배포됩니다.
# 저장소 Settings > Pages 에서 Source를 "Deploy from a branch" / main / (root)로 지정하세요.

theme: minima

# 최신 글이 먼저 보이도록
future: false
timezone: Asia/Seoul

permalink: /:year/:month/:day/:title/

plugins:
  - jekyll-feed
  - jekyll-seo-tag

show_excerpts: true

# 상단 헤더 메뉴에는 소개만 노출 (나머지는 좌측 사이드바)
header_pages:
  - about.md

# 댓글(giscus): 저장소 Discussions 활성화 + giscus 앱 설치 후 https://giscus.app 에서
# repo_id / category_id 를 받아 채우면 글 하단에 댓글창이 켜집니다. 비어 있으면 표시 안 함.
giscus:
  repo: borigunbbang/blog_
  repo_id: ""
  category: Comments
  category_id: ""

minima:
  skin: classic
  date_format: "%Y.%m.%d"
  social_links:
    github: borigunbbang

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
