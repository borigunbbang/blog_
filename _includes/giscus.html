<section class="post-comments">
  <!--
    댓글은 giscus(깃허브 Discussions 기반, 무료/무광고)를 사용합니다.
    아래 3가지를 먼저 해야 댓글창이 실제로 나타납니다:

    1) 이 저장소 Settings > General > Features 에서 "Discussions" 체크
    2) https://github.com/apps/giscus 에서 이 저장소(borigunbbang/blog_)에 App 설치
    3) https://giscus.app 접속 → 저장소 입력 → 옵션 선택 후
       나오는 스크립트에서 data-repo-id / data-category / data-category-id 값을
       아래 값으로 바꿔넣기 (나머지는 그대로 둬도 됩니다)
  -->
  <script src="https://giscus.app/client.js"
    data-repo="borigunbbang/blog_"
    data-repo-id="REPLACE_WITH_REPO_ID"
    data-category="Comments"
    data-category-id="REPLACE_WITH_CATEGORY_ID"
    data-mapping="pathname"
    data-strict="0"
    data-reactions-enabled="1"
    data-emit-metadata="0"
    data-input-position="bottom"
    data-theme="light"
    data-lang="ko"
    data-loading="lazy"
    crossorigin="anonymous"
    async>
  </script>
</section>
